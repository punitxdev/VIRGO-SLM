<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♍ Virgo SLM V1.0 - Official Technical Report & Documentation</title>
    <meta name="description" content="Official technical report and documentation for Virgo SLM V1.0: A 120M parameter small language model built from scratch.">
    <!-- GitHub Markdown CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown-dark.min.css">
    <!-- Highlight.js CSS for Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <!-- Marked.js for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- MathJax for TeX Math Formatting -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --header-bg: rgba(13, 17, 23, 0.85);
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --text-color: #c9d1d9;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* Glassmorphism Header */
        .site-header {
            background: var(--header-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 14px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #f0f6fc;
            font-weight: 700;
            font-size: 18px;
        }

        .header-nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .header-nav a {
            color: #8b949e;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .header-nav a:hover {
            color: var(--accent-color);
        }

        .btn-github {
            background-color: #238636;
            color: #ffffff !important;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 600 !important;
            transition: background-color 0.2s ease !important;
        }

        .btn-github:hover {
            background-color: #2ea043;
        }

        /* Main Container & Layout */
        .main-container {
            max-width: 1080px;
            margin: 0 auto;
            padding: 40px 24px 100px 24px;
        }

        /* Customizing Markdown Render */
        .markdown-body {
            background-color: transparent !important;
            color: var(--text-color) !important;
            font-size: 16px;
        }

        .markdown-body h1 {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            color: #f0f6fc;
        }

        .markdown-body table {
            display: table;
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .markdown-body table th,
        .markdown-body table td {
            border: 1px solid var(--border-color);
            padding: 10px 14px;
        }

        .markdown-body table th {
            background-color: #161b22;
        }

        .markdown-body pre {
            background-color: #161b22 !important;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding: 30px;
            text-align: center;
            color: #8b949e;
            font-size: 14px;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <header class="site-header">
        <a href="#" class="header-brand">
            <span>♍</span>
            <span>Virgo SLM V1.0 Docs</span>
        </a>
        <nav class="header-nav">
            <a href="#executive-summary">Summary</a>
            <a href="#architectural-specifications-table">Architecture</a>
            <a href="#mathematical-formulations">Math</a>
            <a href="#official-kaggle-checkpoints">Kaggle Checkpoints</a>
            <a href="https://github.com/punitxdev/VIRGO-SLM" target="_blank" class="btn-github">GitHub Repo ↗</a>
        </nav>
    </header>

    <main class="main-container">
        <article id="report-content" class="markdown-body">
            <div style="text-align: center; padding: 40px; color: #8b949e;">
                <p>Loading Virgo SLM V1.0 Technical Documentation...</p>
            </div>
        </article>
    </main>

    <footer>
        <p>Virgo SLM V1.0 — Developed by <strong>Punit Kumar Kashyap</strong> (IIT Dharwad)</p>
        <p>Licensed under the MIT License • Built with PyTorch & Pure Vanilla Technologies</p>
    </footer>

    <script>
        // Fetch and Render PROJECT_REPORT.md dynamically
        async function loadDocumentation() {
            try {
                let response = await fetch('./PROJECT_REPORT.md');
                if (!response.ok) {
                    response = await fetch('../PROJECT_REPORT.md');
                }
                const mdText = await response.text();
                
                // Configure marked with highlight.js
                marked.setOptions({
                    highlight: function(code, lang) {
                        if (lang && hljs.getLanguage(lang)) {
                            return hljs.highlight(code, { language: lang }).value;
                        }
                        return hljs.highlightAuto(code).value;
                    },
                    breaks: true
                });

                document.getElementById('report-content').innerHTML = marked.parse(mdText);

                // Trigger MathJax re-render if available
                if (window.MathJax) {
                    MathJax.typesetPromise();
                }
            } catch (err) {
                console.error("Error loading report:", err);
                document.getElementById('report-content').innerHTML = `
                    <h1>Virgo SLM V1.0 Documentation</h1>
                    <p>Welcome to the official GitHub Pages documentation for <strong>Virgo SLM V1.0</strong>.</p>
                    <p>Read the full report directly at <a href="PROJECT_REPORT.md">docs/PROJECT_REPORT.md</a>.</p>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', loadDocumentation);
    </script>
</body>
</html>
