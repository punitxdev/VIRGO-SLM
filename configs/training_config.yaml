# Virgo SLM Training Hyperparameters

training:
  batch_size: 16
  gradient_accumulation_steps: 4
  micro_batch_size: 4
  learning_rate: 6.0e-4
  min_learning_rate: 6.0e-5
  warmup_steps: 2000
  max_steps: 50000
  lr_decay_style: "cosine"
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  precision: "bfloat16"

logging:
  log_interval: 10
  save_interval: 1000
  eval_interval: 500
